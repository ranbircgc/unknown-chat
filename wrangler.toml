name = "unknown-chat-api"
main = "worker/index.ts"
compatibility_date = "2026-11-04"

[vars]
# Set APP_ORIGIN to your exact deployed website origin before deployment.
APP_ORIGIN = "http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "unknown-chat-db"
database_id = "06fc8f78-3b41-4ca5-a537-da5fa687af18"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "MatchmakerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchmakerDO"]