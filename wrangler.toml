name = "unknown-chat-api"
main = "worker/index.ts"
compatibility_date = "2026-11-04"

[vars]
APP_ORIGIN = "https://unknown-chat-web.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "unknown-chat-db"
database_id = "06fc8f78-3b41-4ca5-a537-da5fa687af18"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "MatchmakerDO"

[[durable_objects.bindings]]
name = "SESSION_LIMITER"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchmakerDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiterDO"]

[triggers]
crons = ["0 3 * * *"]
